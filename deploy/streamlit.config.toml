# Mounted read-only; secrets use a separate private secrets.toml.
[server]
address = "0.0.0.0"
port = 8501
headless = true
runOnSave = false
fileWatcherType = "none"
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 20
maxMessageSize = 50

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[logger]
level = "warning"
